<!doctype html>
<html lang="en" data-base="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Idea · AIMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css?v=20260811u">
</head>
<body data-idea-page="1">
  <div class="veil" aria-hidden="true"></div>
  <div class="site">
    <header class="nav">
      <a class="nav-brand" href="index.html">AI<span>Market</span></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html#onboard" data-i18n="nav.onboard">Start</a>
        <a href="index.html#boards" data-i18n="nav.build">Boards</a>
        <a href="index.html#cases" data-i18n="nav.cases">Use cases</a>
      </nav>
      <div class="nav-end">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
          <button type="button" class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
          <button type="button" class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>
          <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">ZH</button>
        </div>
      </div>
    </header>

    <p id="idea-missing" class="idea-missing" hidden data-i18n="idea.missing">Idea not found.</p>

    <article id="idea-page" hidden>
      <div class="idea-hero">
        <div class="idea-hero-copy">
          <a id="idea-back" class="icard-go" href="index.html#boards" data-i18n="idea.back">← All boards</a>
          <div style="height:14px"></div>
          <span id="idea-chip" class="chip chip-live">live</span>
          <h1 id="idea-title">Idea</h1>
          <p id="idea-lead" class="idea-lead"></p>
          <div class="idea-actions">
            <a id="idea-cta" class="btn btn-live" href="#" target="_blank" rel="noopener">Open</a>
            <a class="btn btn-ghost" href="index.html#boards" data-i18n="idea.back">← All boards</a>
          </div>
          <div id="idea-livepath-wrap" hidden>
            <p class="idea-livepath-label" data-i18n="idea.livePath">Live path now</p>
            <div id="idea-livepath" class="path idea-livepath"></div>
          </div>
          <p style="margin:22px 0 8px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)" data-i18n="idea.rails">Rails</p>
          <div id="idea-rails" class="rail-pills"></div>
          <p class="idea-telemetry">
            <a href="https://hunt.modelmarket.dev/" target="_blank" rel="noopener"><span data-i18n="idea.telemetry">See these rails in live telemetry — play a Signal Hunt round</span> ↗</a>
          </p>
        </div>
        <div class="idea-viz" aria-hidden="true">
          <canvas id="idea-canvas"></canvas>
        </div>
      </div>
      <div class="idea-facts">
        <div class="fact"><p id="idea-who"></p></div>
        <div class="fact"><p id="idea-artifact"></p></div>
        <div class="fact"><p id="idea-not"></p></div>
        <div class="fact"><p id="idea-hard"></p></div>
      </div>
    </article>

    <footer class="foot">
      <div class="wrap">
        <div><strong>AIMarket</strong> · portal</div>
        <div data-i18n="foot.line">Point your domain at /portal · MIT surfaces · crypto optional</div>
      </div>
    </footer>
  </div>
  <script type="module" src="js/i18n.js?v=20260811u"></script>
  <script type="module" src="js/idea-page.js?v=20260811u"></script>
</body>
</html>
